name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-equivalent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/checks/ci_policy.py
        env:
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python3 -m unittest discover -s scripts/checks -p 'test_*.py'
      - run: uv sync --project services/backend --locked
      - run: uv run --project services/backend ruff check --config services/backend/pyproject.toml services/backend scripts/checks
      - run: npm ci && npm run build && npm run test:sites
        working-directory: frontend/web
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - id: environment
        run: python3 scripts/checks/init_environment.py
      - run: uv run --project services/backend python scripts/checks/runtime_smoke.py --env-file ../runtime/live-002/private.env
      - run: uv run --project services/backend python scripts/checks/backend_integration_tests.py --env-file ../runtime/live-002/private.env
      - if: always() && steps.environment.outcome == 'success'
        run: docker compose --env-file ../runtime/live-002/private.env -f infra/compose.yaml down
      - if: hashFiles('docs/contracts/check_examples.py') != ''
        run: uv run --project services/backend --with jsonschema==4.26.0 python docs/contracts/check_examples.py
