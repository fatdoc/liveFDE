schema_version: 1
enabled: false
# Opt-in only: HTTPS candidates for allowed wxlivecdn.com hosts; no HTTP fallback.
# Also include wxlivecdn.com (or narrower hosts) in stream_domains when enabling.
wechat_https_upgrade: false
# Copy to capture-policy.yaml in LIVE_MODEL_CONFIG_DIR; local values in capture.local.yaml.
# root: /absolute/workspace/runtime/live-015/captures
# douyin_python: /absolute/workspace/runtime/live-015/douyin-venv/bin/python
# douyin_checkout: /absolute/workspace/runtime/live-015/upstream/DouyinLiveRecorder
# finder_executable: /absolute/workspace/runtime/live-015/finder-venv/bin/wechat-finder-dlna
finder_name: FDE Capture
finder_port: 8198
max_seconds: 14400
default_duration_seconds: 7200
max_bytes: 17179869184
default_max_bytes: 8589934592
min_free_bytes: 2147483648
# Remove older 60-second/50-MB overrides from environment/local layers when upgrading.
# Actual capacity is bounded by free space for the recording plus import copies.
# Web/native capture reads the workspace's private platform settings snapshot.
# Configure Cookie through Settings > Platform access; never store credentials in this YAML.
