[project]
name = "live-review"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "pydantic-settings==2.15.0", "sqlalchemy==2.0.54", "psycopg[binary]==3.3.6", "alembic==1.20.0", "celery==5.6.3"]
[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.16.10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.isort]
known-first-party = ["live_review"]
